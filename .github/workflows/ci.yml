name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - run: npx cdk synth
        env:
          AWS_EC2_METADATA_DISABLED: 'true'

  flow-diagrams:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}
      - run: npx tsx bin/flow-diagram-comment.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
